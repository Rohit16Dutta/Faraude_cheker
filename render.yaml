# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/Rohit16Dutta/Faraude_cheker
# Render asks for each "sync: false" value during setup. Leave a courier blank to skip it.
services:
  - type: web
    name: courier-check
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ACCESS_KEY
        generateValue: true
      - key: STEADFAST_USER
        sync: false
      - key: STEADFAST_PASSWORD
        sync: false
      - key: PATHAO_USER
        sync: false
      - key: PATHAO_PASSWORD
        sync: false
      - key: REDX_PHONE
        sync: false
      - key: REDX_PASSWORD
        sync: false
      - key: PAPERFLY_USER
        sync: false
      - key: PAPERFLY_PASSWORD
        sync: false
      - key: CARRYBEE_PHONE
        sync: false
      - key: CARRYBEE_PASSWORD
        sync: false
